<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Firefox file picker (documentation mock)</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
        background: rgba(0, 0, 0, 0.35);
        min-height: 520px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .sheet {
        width: 560px;
        background: #ececec;
        border-radius: 12px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
        overflow: hidden;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: #f5f5f7;
        border-bottom: 1px solid #d1d1d6;
      }
      .toolbar h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      .search {
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #c7c7cc;
        font-size: 13px;
        width: 140px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        padding: 20px 24px 8px;
        background: #fff;
        min-height: 200px;
      }
      .file {
        text-align: center;
        font-size: 11px;
        color: #1d1d1f;
      }
      .file.selected .icon {
        outline: 3px solid #007aff;
        outline-offset: 2px;
        border-radius: 8px;
      }
      .icon {
        width: 56px;
        height: 64px;
        margin: 0 auto 6px;
        border-radius: 6px;
        background: linear-gradient(180deg, #f2f2f7 0%, #e5e5ea 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 700;
        color: #636366;
      }
      .file.selected .name {
        font-weight: 600;
        color: #007aff;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: #f5f5f7;
        border-top: 1px solid #d1d1d6;
        font-size: 13px;
      }
      .format select {
        margin-left: 8px;
        padding: 4px 8px;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      .actions button {
        padding: 6px 20px;
        border-radius: 6px;
        border: 1px solid #c7c7cc;
        background: #fff;
        font-size: 13px;
      }
      .actions .primary {
        background: #007aff;
        color: #fff;
        border-color: #007aff;
        font-weight: 600;
      }
      .callout {
        margin: 0 24px 12px;
        padding: 10px 12px;
        background: #e8f4ff;
        border-left: 4px solid #007aff;
        font-size: 12px;
        border-radius: 0 6px 6px 0;
      }
      .label {
        padding: 12px 24px 0;
        font-size: 11px;
        font-weight: 700;
        color: #007aff;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <div class="sheet">
      <div class="toolbar">
        <h2>extension</h2>
        <input class="search" type="text" value="Search" readonly />
      </div>
      <p class="label">Firefox — Step 2: select manifest.json</p>
      <p class="callout">
        Set format to <strong>All Files</strong>, then select <strong>manifest.json</strong> (not the folder).
        Or load <strong>markdown-ext.xpi</strong> from the zip instead.
      </p>
      <div class="grid">
        <div class="file">
          <div class="icon">JS</div>
          <div class="name">content.js</div>
        </div>
        <div class="file selected">
          <div class="icon">JSON</div>
          <div class="name">manifest.json</div>
        </div>
        <div class="file">
          <div class="icon">HTML</div>
          <div class="name">popup.html</div>
        </div>
        <div class="file">
          <div class="icon">JS</div>
          <div class="name">popup.js</div>
        </div>
        <div class="file">
          <div class="icon">JS</div>
          <div class="name">readability…</div>
        </div>
        <div class="file">
          <div class="icon">JS</div>
          <div class="name">turndown…</div>
        </div>
      </div>
      <div class="footer">
        <div class="format">
          Format: <select><option>All Files</option></select>
        </div>
        <div class="actions">
          <button type="button">Cancel</button>
          <button type="button" class="primary">Open</button>
        </div>
      </div>
    </div>
  </body>
</html>
