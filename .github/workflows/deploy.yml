name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - name: Optimize setup images
        run: |
          cd landing/scripts
          npm install
          node optimize-setup-images.mjs
          cp ../../extension/icons/icon-128.png ../images/og.png

      - name: Package Extension
        run: |
          cd extension
          zip -r ../landing/firefox-extension.xpi . -x "*.DS_Store"
          cd ..
          mkdir -p dist/markdown-ext
          cp -r extension dist/markdown-ext/chrome-extension
          cp landing/firefox-extension.xpi dist/markdown-ext/
          cp landing/INSTALL.txt dist/markdown-ext/
          cp landing/START-HERE.txt dist/markdown-ext/
          cd dist && zip -r ../landing/markdown-ext.zip markdown-ext

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler@latest pages project create markdown-ext --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler@latest pages deploy landing --project-name=markdown-ext --commit-dirty=true

