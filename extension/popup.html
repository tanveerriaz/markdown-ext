<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Convert</title>
    <style>
      :root {
        color-scheme: dark;
        --bg0: #070a12;
        --bg1: #0b1020;
        --fg: #eef2ff;
        --muted: rgba(238, 242, 255, 0.72);
        --card: rgba(255, 255, 255, 0.06);
        --stroke: rgba(255, 255, 255, 0.14);
        --accent: #7c3aed;
        --accent2: #22c55e;
      }
      body {
        margin: 0;
        padding: 12px 12px 12px;
        width: 340px;
        color: var(--fg);
        background: radial-gradient(520px 240px at 20% 0%, rgba(124, 58, 237, 0.22), transparent 60%),
          radial-gradient(520px 260px at 80% 30%, rgba(34, 197, 94, 0.16), transparent 62%),
          linear-gradient(180deg, var(--bg0), var(--bg1));
        font: 13px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      .top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 10px;
        border: 1px solid var(--stroke);
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
      }
      .brand {
        min-width: 0;
      }
      h1 {
        font-size: 14px;
        line-height: 1.2;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .tabTitle {
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 250px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 12px;
        border: 1px solid var(--stroke);
        background: rgba(255, 255, 255, 0.06);
        color: var(--fg);
        cursor: pointer;
        user-select: none;
        transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
      }
      .btn:hover {
        transform: translateY(-1px);
        background: rgba(255, 255, 255, 0.09);
        border-color: rgba(255, 255, 255, 0.18);
      }
      .btn:active {
        transform: translateY(0px);
      }
      .btn.primary {
        background: linear-gradient(135deg, rgba(124, 58, 237, 0.95), rgba(34, 197, 94, 0.75));
        border-color: rgba(255, 255, 255, 0.22);
      }
      .btn[disabled] {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        margin-top: 10px;
      }

      .row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .panel {
        margin-top: 10px;
        border: 1px solid var(--stroke);
        background: var(--card);
        border-radius: 14px;
        overflow: hidden;
      }

      .panelHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .panelHeader strong {
        font-size: 12px;
        letter-spacing: 0.2px;
      }

      .status {
        font-size: 12px;
        color: var(--muted);
        word-break: break-word;
        text-align: right;
        max-width: 55%;
      }

      textarea {
        width: 100%;
        min-height: 230px;
        resize: vertical;
        border: 0;
        outline: none;
        padding: 10px;
        background: transparent;
        color: var(--fg);
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="brand">
        <h1>Markdown Convert</h1>
        <div class="tabTitle" id="tabTitle" title=""></div>
      </div>
      <button class="btn primary" id="convertBtn">Convert</button>
    </div>

    <div class="actions hidden" id="postActions">
      <div class="row2">
        <button class="btn" id="copyBtn">Copy to Clipboard</button>
        <button class="btn" id="downloadBtn">Download .md</button>
      </div>
    </div>

    <div class="panel">
      <div class="panelHeader">
        <strong>Markdown preview</strong>
        <div class="status" id="status" aria-live="polite"></div>
      </div>
      <textarea id="markdownPreview" spellcheck="false" placeholder="Click Convert to generate Markdown…" readonly></textarea>
    </div>

    <script src="turndown.min.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
